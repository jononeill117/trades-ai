<!doctype html>
<!-- Fictional social composer page — stand-in for a platform's web post
     composer (GBP update, FB page post, IG creator). -->
<html><head><title>Compose post</title></head><body>
<h1>New post</h1>
<form method="post" action="/posts">
  <textarea name="caption" id="caption"></textarea>
  <input name="photos" id="photos" type="file" multiple>
  <button type="submit" id="post-submit">Publish</button>
</form>
</body></html>
