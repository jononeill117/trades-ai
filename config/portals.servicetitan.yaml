# ServiceTitan adapter config — COMMUNITY EXAMPLE.
# Fill these in to match YOUR tenant; ServiceTitan screens vary by account
# and release. Do NOT put credentials here — use a Solari browser profile.

base_url: ""    # e.g. https://go.servicetitan.com

selectors:
  url.login: "/login"
  url.new_job: "/app/job/new"          # placeholder — check your tenant
  url.job: "/app/job/{id}"
  login.email: "#email"                # usually unused: profile holds auth
  login.password: "#password"
  login.submit: "button[type=submit]"
  job.customer: "input[name=customer]"
  job.site: "input[name=address]"
  job.tenant: "input[name=contact]"
  job.tenant_phone: "input[name=phone]"
  job.trade: "input[name=trade]"
  job.priority: "input[name=priority]"
  job.window_start: "input[name=windowStart]"
  job.window_end: "input[name=windowEnd]"
  job.notes: "textarea[name=summary]"
  job.submit: "#save-job"
  confirm.button: "#confirm"
  confirm.status: ".job-status"
